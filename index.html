<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fap It Out</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at top, #313131, #111 70%);
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            overflow: hidden;
        }

        #game-container {
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 8px;
            letter-spacing: 3px;
            text-shadow: 4px 4px 0 #000;
        }

        #subtitle {
            color: #aaa;
            margin-bottom: 12px;
            font-size: 14px;
        }

        #game {
            position: relative;
            width: 500px;
            max-width: 95vw;
        }

        canvas {
            display: block;
            width: 500px;
            max-width: 95vw;
            height: 720px;
            max-height: 82vh;

            background: #87ceeb;

            border: 5px solid #222;
            border-radius: 12px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.6);

            cursor: pointer;
            touch-action: none;
        }

        #score-board {
            position: absolute;
            top: 15px;
            left: 50%;

            transform: translateX(-50%);

            font-size: 42px;
            font-weight: bold;

            color: white;
            text-shadow:
                3px 3px 0 #000,
                -1px -1px 0 #000;

            pointer-events: none;
            z-index: 5;
        }

        #menu {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            width: 80%;

            padding: 30px 20px;

            background: rgba(0, 0, 0, 0.78);

            border: 3px solid white;
            border-radius: 18px;

            z-index: 10;

            backdrop-filter: blur(5px);
        }

        #menu h2 {
            font-size: 36px;
            margin-bottom: 12px;
        }

        #menu p {
            color: #ddd;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        button {
            border: none;
            padding: 14px 28px;

            border-radius: 10px;

            background: #ffcc00;
            color: #111;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.15s;
        }

        button:hover {
            transform: scale(1.05);
            background: #ffe066;
        }

        button:active {
            transform: scale(0.95);
        }

        #challenge-button {
            display: block;
            width: 100%;
            margin-top: 12px;
            background: #ff7a18;
        }

        #challenge-button:hover {
            background: #ff9a4d;
        }

        #game-over {
            display: none;
        }

        #final-score {
            font-size: 24px;
            margin-bottom: 8px;
        }

        #high-score {
            color: #ffcc00;
            margin-bottom: 20px;
        }

        #instructions {
            margin-top: 12px;
            color: #aaa;
            font-size: 13px;
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 30px;
            }

            #subtitle {
                font-size: 12px;
            }

            canvas {
                height: 75vh;
            }
        }
    </style>
</head>

<body>

<div id="game-container">

    <h1>FAP IT OUT</h1>

    <div id="subtitle">
        The world's most unnecessary flappy game.
    </div>

    <div id="game">

        <canvas id="canvas" width="500" height="720"></canvas>

        <div id="score-board">
            0
        </div>

        <!-- START MENU -->
        <div id="menu">

            <div id="start-screen">

                <h2>💀 FAP IT OUT</h2>

                <p>
                    Help bro navigate through the pipes.
                    <br>
                    One wrong move and it's over.
                </p>

                <button id="start-button">
                    START FAPPING
                </button>

                <button id="challenge-button">
                    TAKE THE CHALLENGE (30)
                </button>

            </div>

            <!-- GAME OVER -->
            <div id="game-over">

                <h2>💀 BRO FAPPED OUT</h2>

                <div id="final-score">
                    Score: 0
                </div>

                <div id="high-score">
                    Best: 0
                </div>

                <button id="restart-button">
                    TRY AGAIN
                </button>

            </div>

        </div>

    </div>

    <div id="instructions">
        SPACE / CLICK / TAP = FLAP
    </div>

</div>


<script>

"use strict";

/* =========================================================
   SETUP
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const scoreBoard = document.getElementById("score-board");

const menu = document.getElementById("menu");

const startScreen = document.getElementById("start-screen");
const gameOverScreen = document.getElementById("game-over");

const startButton = document.getElementById("start-button");
const challengeButton = document.getElementById("challenge-button");
const restartButton = document.getElementById("restart-button");

const finalScore = document.getElementById("final-score");
const highScoreText = document.getElementById("high-score");


/* =========================================================
   SOUND
========================================================= */

const flapSound = new Audio("fap.mp3");
const backgroundMusic = new Audio("bg.mp3");

flapSound.preload = "auto";
flapSound.volume = 1;
backgroundMusic.preload = "auto";
backgroundMusic.loop = true;
backgroundMusic.volume = 0.12;

function playFlapSound() {

    /* Rewind so quick consecutive taps each make a sound. */
    flapSound.currentTime = 0;

    flapSound.play().catch(function() {
        /* Browsers can block audio until a user gesture. */
    });

}

function playBackgroundMusic() {

    backgroundMusic.play().catch(function() {
        /* It will start on the next user-initiated game start. */
    });

}


/* =========================================================
   PLAYER IMAGE
========================================================= */

const playerImage = new Image();

playerImage.src = "head.png";

const pipeImage = new Image();

pipeImage.src = "dick.png";


/* =========================================================
   GAME CONSTANTS
========================================================= */

const WIDTH = canvas.width;
const HEIGHT = canvas.height;

const GROUND_HEIGHT = 70;

const PIPE_WIDTH = 86;

const PIPE_GAP = 175;

const PIPE_DISTANCE = 250;


/* =========================================================
   GAME VARIABLES
========================================================= */

let gameRunning = false;

let gameOver = false;

let score = 0;

let highScore = 0;

let lastTime = 0;

let pipeTimer = 0;

let animationFrame;

/* Challenge mode is enabled only by the main-menu challenge button. */
let challengeMode = false;


/* =========================================================
   PLAYER
========================================================= */

const player = {

    x: 105,

    y: HEIGHT / 2,

    radius: 31,

    velocity: 0,

    gravity: 0.42,

    flapPower: -7.5,

    rotation: 0

};


/* =========================================================
   PIPES
========================================================= */

let pipes = [];


/* =========================================================
   RESET GAME
========================================================= */

function resetGame() {

    player.x = 105;

    player.y = HEIGHT / 2;

    player.velocity = 0;

    player.rotation = 0;

    pipes = [];

    score = 0;

    pipeTimer = 0;

    scoreBoard.textContent = "0";

    gameOver = false;

}


/* =========================================================
   START GAME
========================================================= */

function startGame(enableChallenge = challengeMode) {

    challengeMode = enableChallenge;

    resetGame();

    menu.style.display = "none";

    gameRunning = true;

    lastTime = performance.now();

    animationFrame = requestAnimationFrame(gameLoop);

    playBackgroundMusic();

    flap();

}


/* =========================================================
   FLAP
========================================================= */

function flap() {

    if (!gameRunning) {
        return;
    }

    if (gameOver) {
        return;
    }

    player.velocity = player.flapPower;

    playFlapSound();

}


/* =========================================================
   CREATE PIPE
========================================================= */

function createPipe() {

    const minimumTop = 80;

    const maximumTop =
        HEIGHT -
        GROUND_HEIGHT -
        PIPE_GAP -
        80;

    const top =
        minimumTop +
        Math.random() *
        (maximumTop - minimumTop);

    pipes.push({

        x: WIDTH,

        top: top,

        bottom: top + PIPE_GAP,

        passed: false

    });

}


/* =========================================================
   UPDATE PLAYER
========================================================= */

function updatePlayer(delta) {

    player.velocity += player.gravity * delta;

    player.y += player.velocity * delta;


    /* Rotation */

    player.rotation =
        Math.max(
            -0.5,
            Math.min(
                1.2,
                player.velocity * 0.08
            )
        );


    /* Ceiling */

    if (
        player.y - player.radius <= 0
    ) {

        player.y =
            player.radius;

        player.velocity = 0;

    }


}


/* =========================================================
   UPDATE PIPES
========================================================= */

function updatePipes(delta) {

    /*
        Game gets slightly faster as
        the player scores.
    */

    const pipeSpeed =
        Math.min(
            5,
            2.8 + score * 0.025
        );


    for (let i = pipes.length - 1; i >= 0; i--) {

        const pipe = pipes[i];

        pipe.x -= pipeSpeed * delta;


        /* Score */

        if (
            !pipe.passed &&
            pipe.x + PIPE_WIDTH < player.x
        ) {

            pipe.passed = true;

            score++;

            scoreBoard.textContent = score;

            if (challengeMode && score >= 30) {

                completeChallenge();

                return;

            }

        }


        /* Remove pipe */

        if (
            pipe.x + PIPE_WIDTH < 0
        ) {

            pipes.splice(i, 1);

        }

    }


    /* Spawn */

    pipeTimer -= delta;

    if (pipeTimer <= 0) {

        createPipe();

        pipeTimer = PIPE_DISTANCE / pipeSpeed;

    }

}


/* =========================================================
   CHALLENGE COMPLETE
========================================================= */

function completeChallenge() {

    gameRunning = false;

    cancelAnimationFrame(animationFrame);

    backgroundMusic.pause();
    backgroundMusic.currentTime = 0;

    window.location.href = "surprise.html";

}


/* =========================================================
   COLLISION DETECTION
========================================================= */

function checkCollision() {

    /* Ground */

    if (
        player.y + player.radius >=
        HEIGHT - GROUND_HEIGHT
    ) {

        return true;

    }


    /* Pipes */

    for (const pipe of pipes) {

        const pipeLeft = pipe.x;

        const pipeRight =
            pipe.x + PIPE_WIDTH;


        const touchingPipeX =
            player.x + player.radius > pipeLeft &&
            player.x - player.radius < pipeRight;


        if (!touchingPipeX) {
            continue;
        }


        const touchingTopPipe =
            player.y - player.radius <
            pipe.top;


        const touchingBottomPipe =
            player.y + player.radius >
            pipe.bottom;


        if (
            touchingTopPipe ||
            touchingBottomPipe
        ) {

            return true;

        }

    }


    return false;

}


/* =========================================================
   GAME OVER
========================================================= */

function endGame() {

    gameRunning = false;

    gameOver = true;

    cancelAnimationFrame(animationFrame);

    backgroundMusic.pause();
    backgroundMusic.currentTime = 0;


    if (score > highScore) {

        highScore = score;

    }


    finalScore.textContent =
        "Score: " + score;


    highScoreText.textContent =
        "Best: " + highScore;


    menu.style.display = "block";

    startScreen.style.display = "none";

    gameOverScreen.style.display = "block";

}


/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawBackground() {

    /* Sky */

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            HEIGHT
        );

    gradient.addColorStop(
        0,
        "#62c8f2"
    );

    gradient.addColorStop(
        1,
        "#d7f5ff"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    /* Clouds */

    ctx.fillStyle =
        "rgba(255,255,255,0.7)";


    drawCloud(80, 100, 1);

    drawCloud(300, 170, 0.8);

    drawCloud(190, 270, 0.6);

}


/* =========================================================
   CLOUD
========================================================= */

function drawCloud(x, y, scale) {

    ctx.save();

    ctx.translate(x, y);

    ctx.scale(scale, scale);

    ctx.beginPath();

    ctx.arc(
        0,
        10,
        25,
        0,
        Math.PI * 2
    );

    ctx.arc(
        25,
        0,
        32,
        0,
        Math.PI * 2
    );

    ctx.arc(
        55,
        12,
        23,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.restore();

}


/* =========================================================
   DRAW PIPE
========================================================= */

function drawPipe(pipe) {

    const bottomHeight =
        HEIGHT - GROUND_HEIGHT - pipe.bottom;

    /*
        dick.png points upward, so the top obstacle is rotated
        to point down into the gap. The image is stretched only
        within each pipe section so it always reaches the edge.
    */
    if (
        pipeImage.complete &&
        pipeImage.naturalWidth > 0
    ) {

        ctx.save();

        ctx.translate(
            pipe.x + PIPE_WIDTH / 2,
            pipe.top / 2
        );

        ctx.rotate(Math.PI);

        ctx.drawImage(
            pipeImage,
            -PIPE_WIDTH / 2,
            -pipe.top / 2,
            PIPE_WIDTH,
            pipe.top
        );

        ctx.restore();

        ctx.drawImage(
            pipeImage,
            pipe.x,
            pipe.bottom,
            PIPE_WIDTH,
            bottomHeight
        );

        return;

    }

    const capHeight = 14;

    /* Pipe body */

    ctx.fillStyle = "#55a83f";

    ctx.fillRect(
        pipe.x,
        0,
        PIPE_WIDTH,
        pipe.top
    );


    ctx.fillRect(
        pipe.x,
        pipe.bottom,
        PIPE_WIDTH,
        HEIGHT -
        GROUND_HEIGHT -
        pipe.bottom
    );


    /* Pipe caps */

    ctx.fillStyle = "#67bd4b";


    ctx.fillRect(
        pipe.x - 6,
        pipe.top - capHeight,
        PIPE_WIDTH + 12,
        capHeight
    );


    ctx.fillRect(
        pipe.x - 6,
        pipe.bottom,
        PIPE_WIDTH + 12,
        capHeight
    );


    /* Shadow */

    ctx.fillStyle =
        "rgba(0,0,0,0.15)";


    ctx.fillRect(
        pipe.x,
        0,
        9,
        pipe.top
    );


    ctx.fillRect(
        pipe.x,
        pipe.bottom,
        9,
        HEIGHT -
        GROUND_HEIGHT -
        pipe.bottom
    );

}


/* =========================================================
   DRAW GROUND
========================================================= */

function drawGround() {

    const groundY =
        HEIGHT - GROUND_HEIGHT;


    /* Dirt */

    ctx.fillStyle = "#c89b45";

    ctx.fillRect(
        0,
        groundY,
        WIDTH,
        GROUND_HEIGHT
    );


    /* Grass */

    ctx.fillStyle = "#5ca943";

    ctx.fillRect(
        0,
        groundY,
        WIDTH,
        12
    );


    /* Grass details */

    ctx.fillStyle = "#3d7f2e";

    for (
        let x = 0;
        x < WIDTH;
        x += 30
    ) {

        ctx.fillRect(
            x,
            groundY + 12,
            15,
            5
        );

    }

}


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer() {

    ctx.save();

    ctx.translate(
        player.x,
        player.y
    );

    ctx.rotate(
        player.rotation
    );

    /*
        Draw the actual head image.
        NO circular clipping.
        NO circular outline.
    */

    if (
        playerImage.complete &&
        playerImage.naturalWidth > 0
    ) {

        const size = player.radius * 2.4;

        ctx.drawImage(
            playerImage,

            -size / 2,
            -size / 2,

            size,
            size
        );

    }

    ctx.restore();
}


/* =========================================================
   DRAW EVERYTHING
========================================================= */

function draw() {

    drawBackground();

    for (const pipe of pipes) {

        drawPipe(pipe);

    }

    drawGround();

    drawPlayer();

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(time) {

    if (!gameRunning) {
        return;
    }


    let delta =
        (time - lastTime) / 16.67;


    /*
        Prevent huge jumps if the browser
        freezes for a moment.
    */

    delta =
        Math.min(delta, 2);


    lastTime = time;


    updatePlayer(delta);

    updatePipes(delta);

    if (!gameRunning) {
        return;
    }


    if (checkCollision()) {

        draw();

        endGame();

        return;

    }


    draw();


    animationFrame =
        requestAnimationFrame(gameLoop);

}


/* =========================================================
   INPUT
========================================================= */


/* Keyboard */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code === "Space" ||
            event.code === "ArrowUp"
        ) {

            event.preventDefault();


            if (!gameRunning) {

                if (gameOver) {

                    startGame();

                }

            }
            else {

                flap();

            }

        }

    }
);


/* Mouse */

canvas.addEventListener(
    "mousedown",
    function() {

        if (!gameRunning) {

            if (gameOver) {

                startGame();

            }

            return;

        }

        flap();

    }
);


/* Touch */

canvas.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();


        if (!gameRunning) {

            if (gameOver) {

                startGame();

            }

            return;

        }

        flap();

    },
    {
        passive: false
    }
);


/* Buttons */

startButton.addEventListener(
    "click",
    function() {

        startGame(false);

    }
);


challengeButton.addEventListener(
    "click",
    function() {

        startGame(true);

    }
);


restartButton.addEventListener(
    "click",
    startGame
);


/* =========================================================
   IMAGE LOADING
========================================================= */

playerImage.onload = function() {

    draw();

};


pipeImage.onload = function() {

    draw();

};


playerImage.onerror = function() {

    console.error(
        "Could not load head.png"
    );

    alert(
        "Couldn't find head.png! Make sure it is in the same folder as index.html."
    );

};


/* =========================================================
   INITIAL DRAW
========================================================= */

resetGame();

draw();

</script>

</body>
</html>
